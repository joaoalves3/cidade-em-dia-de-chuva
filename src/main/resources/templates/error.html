<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Erro')}"></head>
<body>
<a class="pular" href="#conteudo">Pular para o conteúdo</a>
<div class="app">
    <aside th:replace="~{fragments/layout :: menu('')}"></aside>
    <main class="principal" id="conteudo">
        <div class="vazio">
            <i aria-hidden="true" class="bi bi-exclamation-triangle"></i>
            <h1 th:text="${status == 404} ? 'Página não encontrada' : 'Não foi possível concluir a ação'">Erro</h1>
            <p th:text="${message}">Mensagem</p>
            <a class="botao" th:href="@{/}">Voltar ao início</a>
        </div>
    </main>
</div>
<script th:replace="~{fragments/layout :: scripts}"></script>
</body>
</html>
